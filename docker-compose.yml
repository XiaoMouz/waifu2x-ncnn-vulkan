services:
  waifu2x-web:
    image: ghcr.io/xiaomouz/waifu2x-ncnn-vulkan:latest
    container_name: waifu2x-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - waifu2x-uploads:/app/uploads
      - waifu2x-outputs:/app/outputs
    # ---- NVIDIA GPU passthrough (requires nvidia-container-toolkit) ----
    # The image has NO software Vulkan renderer (mesa removed to fix CPU-mode
    # crashes). GPU support requires the host driver ICD to be passed through.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    #
    # ---- AMD / Intel GPU passthrough (Linux DRI) ----
    # devices:
    #   - /dev/dri:/dev/dri

volumes:
  waifu2x-uploads:
  waifu2x-outputs:
